<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Workday Job Application - Staff Platform Engineer</title>
</head>
<body>
  <div class="workday-application-container" data-automation-id="applicationPage">
    <h2>Apply for Platform Engineer</h2>
    <form id="wd-Application">
      <!-- Legal Name Section -->
      <div data-automation-id="legalNameSection">
        <div class="wd-form-group">
          <label for="input-first-name">First Name <span class="required">*</span></label>
          <input type="text" id="input-first-name" data-automation-id="legalNameSection_firstName" placeholder="Enter first name" />
        </div>
        <div class="wd-form-group">
          <label for="input-last-name">Last Name <span class="required">*</span></label>
          <input type="text" id="input-last-name" data-automation-id="legalNameSection_lastName" placeholder="Enter last name" />
        </div>
      </div>

      <!-- Contact Information -->
      <div data-automation-id="contactInfoSection">
        <div class="wd-form-group">
          <label for="input-email">Email Address <span class="required">*</span></label>
          <input type="email" id="input-email" data-automation-id="email" placeholder="example@email.com" />
        </div>
        <div class="wd-form-group">
          <label for="input-phone">Phone Number <span class="required">*</span></label>
          <input type="tel" id="input-phone" data-automation-id="phone-number" placeholder="Phone Number" />
        </div>
      </div>

      <!-- Address / Location -->
      <div data-automation-id="addressSection">
        <div class="wd-form-group">
          <label for="input-city">City <span class="required">*</span></label>
          <input type="text" id="input-city" data-automation-id="addressSection_city" placeholder="City" />
        </div>
      </div>

      <!-- Links & Social -->
      <div data-automation-id="socialLinksSection">
        <div class="wd-form-group">
          <label for="input-linkedin">LinkedIn Profile URL</label>
          <input type="text" id="input-linkedin" data-automation-id="linkedin" placeholder="https://www.linkedin.com/in/..." />
        </div>
        <div class="wd-form-group">
          <label for="input-website">Website / Portfolio</label>
          <input type="text" id="input-website" data-automation-id="portfolio" placeholder="Portfolio website" />
        </div>
      </div>

      <!-- Resume Attachment -->
      <div data-automation-id="resumeSection">
        <label for="wd-resume-upload">Upload Resume <span class="required">*</span></label>
        <input type="file" id="wd-resume-upload" data-automation-id="file-upload-input" accept=".pdf,.doc,.docx" />
      </div>

      <button type="button" data-automation-id="bottom-navigation-next-button">Next</button>
    </form>
  </div>
</body>
</html>
