name: AI Job Hunter CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ai_hunter_user
          POSTGRES_PASSWORD: ai_hunter_password
          POSTGRES_DB: ai_job_hunter
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://ai_hunter_user:ai_hunter_password@localhost:5435/ai_job_hunter
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://ai_hunter_user:ai_hunter_password@localhost:5435/ai_job_hunter
        run: |
          cd backend
          pytest -v

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build & Type-Check Frontend
        run: |
          cd frontend
          npm run build
